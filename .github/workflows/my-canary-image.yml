# FORK-INTERNAL — lives on the fork-ci branch of s3ntin3l8/Listenarr and rides
# into my-canary via merge. Never PR this upstream.
#
# Builds the personal integration branch (upstream canary + unmerged fix
# branches) into a Docker image that unraid pulls.
name: Build my-canary image

on:
  push:
    branches: [ my-canary ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: my-canary-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/s3ntin3l8/listenarr:my-canary
            ghcr.io/s3ntin3l8/listenarr:my-canary-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
